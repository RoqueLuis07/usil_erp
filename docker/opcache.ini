; Cache de opcodes: sin esto PHP recompila cada archivo del framework en cada petición.
; La imagen es inmutable (cada despliegue es un contenedor nuevo), por eso no hace falta revalidar archivos.
opcache.enable=1
; el servidor de "php artisan serve" corre bajo el SAPI cli-server, que respeta enable_cli
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=off
realpath_cache_size=4096K
realpath_cache_ttl=600
